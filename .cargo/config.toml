# Increase main thread stack size to prevent overflow when debugging.
# Windows default is ~1MB; MathCAT's initialization can exceed this.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]

         then: [t: "is"]
     - t: "to"

 - "∼": [t: "varies with"]                         # 0x223c

 - "≠":                                          # 0x2260
     - test: 
         if: "$Verbosity!='Terse'"
         then: [t: "is"]
     - t: "not equal to"

 - "≡":                                          # 0x2261
     - test: 
         if: "$Verbosity!='Terse'"
         then: [t: "is"]
     - t: "identical to"

 - "≤":                                          # 0x2264
     - test: 
         if: "$Verbosity!='Terse'"
         then: [t: "is"]
     - t:  "less than or equal to"

 - "≥":                                          # 0x2265
     - test: 
         if: "$Verbosity!='Terse'"
         then: [t: "is"]
     - t: "greater than or equal to"

 - "⊂":                                          # 0x2282
     - test: 
         if: "$Verbosity!='Terse'"
         then: [t: "is a"]
     - t: "subset of"

 - "⊆":                                          # 0x2286
     - test: 
         if: "$Verbosity!='Terse'"
         then: [t: "is a"]
     - t: "subset of or equal to"

 - "¯":                                            # 0xaf
     - test:
        if: "ancestor::m:modified-variable and preceding-sibling::*[1][self::m:mi]"
        then: [t: "bar"]
        else: [t: "line"]

 - "µ": [t: "micro"]                               # 0xb5

 - "·":
    - test:
        if: "$SpeechStyle != 'ClearSpeak' or $ClearSpeak_MultSymbolDot = 'Auto'"
        then: [t: "times"]
        else: [t: "dot"]

 - "×":                                          # 0xd7
    - test:
        if: "$SpeechStyle != 'ClearSpeak' or $ClearSpeak_MultSymbolX = 'Auto'"
        then: [t: "times"]
        else_test:
            if: $ClearSpeak_MultSymbolX = 'By'
            then: [t: "by"]
            else: [t: "cross"]

 - "÷": [t: "divided by"]                          # 0xf7

 - "ϕ": [t: "phi"]                                 # 0x3d5

 - "–": [t: "en dash"]                             # 0x2013

 - "—": [t: "em dash"]                             # 0x2014

 - "‖": [t: "double vertical line"]                # 0x2016

 - "•":                                            # 0x2022
    - test: 
        if: "@data-chem-formula-op"
        then: [t: "dot"]
        else: [t: "bullet"]


 - "…":                                          # 0x2026
    test:
        if:
            - "$SpeechStyle != 'ClearSpeak' or $ClearSpeak_Ellipses = 'Auto' or"
               # must be ClearSpeak and $ClearSpeak_Ellipses = 'AndSoOn'
               # speak '…' as 'and so on...' unless expr starts with '…'
            - "../*[1][.='…']"
        then: [t: "dot dot dot"]
        else_test:  # must have $ClearSpeak_Ellipses = 'AndSoOn'
            if: "count(following-sibling::*) = 0"
            then: [t: "and so on"]
            else: [t: "and so on up to"]


 - "′": [t: "prime"]                               # 0x2032

 - "″": [t: "double prime"]                        # 0x2033

 - "℉": [t: "degrees fahrenheit"]                  # 0x2109

 - "←": [t: "leftwards arrow"]                     # 0x2190

 - "→": [t: "rightwards arrow"]                    # 0x2192

 - "↔": [t: "left right arrow"]                    # 0x2194


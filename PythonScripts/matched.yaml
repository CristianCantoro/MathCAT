         then: [t: "double vertical line"]
         else:
         - test:
              if: "$Verbosity!='Terse'"
              then: [t: "is"]
         - t: "parallel to"

 - "∧": [t: "and"]                                 # 0x2227

 - "∨": [t: "or"]                                  # 0x2228

 - "∩": [t: "intersection"]                        # 0x2229

 - "∪": [t: "union"]                               # 0x222a

 - "∶":                                          # 0x2236
     - test: 
